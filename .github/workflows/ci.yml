name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest --cov=eval_bridge --cov-report=term-missing --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/eval-bridge-pr-comment
        with:
          junit-path: junit.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest (${{ matrix.python-version }})
          path: junit-${{ matrix.python-version }}.xml
          reporter: java-junit

  fixture-replay:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Replay offline fixtures
        run: |
          eval-bridge run tests/fixtures --junit junit-fixtures.xml --no-exit-on-fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-fixtures
          path: junit-fixtures.xml
